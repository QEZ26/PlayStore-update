name: Check Play Store Update

on:
  schedule:
    # 每天北京时间早上 9 点和晚上 9 点自动检查
    - cron: '0 1,13 * * *'
  workflow_dispatch: # 允许你手动点击按钮触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # 🛠️ 核心改动：自动读取和恢复上一次的版本号缓存
      - name: Restore version cache
        uses: actions/cache@v4
        with:
          path: last_version.txt
          key: playstore-version-cache-${{ github.run_id }}
          restore-keys: |
            playstore-version-cache-

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_version.py

      # 🛠️ 核心改动：运行成功后，强制把最新的版号文件存进 GitHub 官方缓存区
      - name: Save version cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_version.txt
          key: playstore-version-cache-${{ github.run_id }}
